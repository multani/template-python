[project]
name = "NAME"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jonathan Ballet", email = "jon@multani.info" }
]
requires-python = ">=3.13"
dependencies = [
    "click==8.3.3",
    "structlog==25.5.0",
]

[project.scripts]
my-script = "NAME.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-ruff==0.5",
    "pytest-ty==0.2.1",
    "ruff==0.15.13",
    "ty==0.0.35",
]

[tool.pytest]
addopts = [
    "--cov=NAME",
    "--cov-branch",
    "--cov-report=html",
    "--cov-report=term",
    "--doctest-modules",
    "--ruff",
    "--ruff-format",
    "--tb=short",
    "--verbose",
    "--verbose",
    "--ty",
]
testpaths = [
    "NAME",
    "tests",
]

[tool.mypy]
packages = [
    "NAME",
    "tests",
]
strict = true

[tool.ruff.lint]
ignore = [
    # It's OK to have long line
    "E501",
]
extend-select = [
    # Sort imports
    "I",
]

[tool.ruff.lint.isort]
force-single-line = true
